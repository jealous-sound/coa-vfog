; CoAVolFog settings. Changes apply within a second while the game runs,
; except Enable and EngineHooks, which need a client restart.
[CoAVolFog]
Enable=1
EngineHooks=1

; In-game settings window, shown and hidden with OverlayKey. It changes the settings below live; its Save button
; writes the changed ones back to this file and keeps the comments. 0 = off (turning it on again needs a client
; restart; with 0 at start-up the game window is left untouched)
Overlay=1
; F1-F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, a letter or a digit, with optional Ctrl+,
; Shift+ and Alt+ in front
OverlayKey=Ctrl+F7

; 1 = quarter resolution, 16 steps; 2 = half resolution, 24 steps; 3 = half resolution, 32 steps
Quality=2

; Global density multiplier, then the layers used where no Classic data exists: distance haze, low
; ground mist, and the distance fog that replaces the stock fog (FarFog)
Density=1.0
Haze=1.0
GroundFog=0.6
FarFog=1.0

; World-anchored density variation in scene layers; 0 keeps the authored density smooth.
; Amount 0..1 varies density between 1-amount and 1+amount without changing its spatial mean.
; Scale 0.001..1 controls patch size (larger is smaller); wind 0..10 drifts along world +X in yd/s.
; The distance fog remains smooth to preserve the far-clip transition.
NoiseAmount=0.15
NoiseScale=0.025
NoiseWindSpeed=0.5
; 1 = drifting fog banks where the Classic layers carry the modern client's noise (mostly storms); it thins those
; layers to about half their density on average, and the variation above does not apply to them.
; 0 = off, the variation above applies instead
ClassicNoise=1

; 1 = replace the client's linear fog with the volumetric distance fog, 0 = keep the stock fog
StockFog=1

; 1 = use the Classic client's fog layers where its lights cover the map, 0 = derived layers everywhere
DataMode=1
; 1 = scatter and blend in linear light like the modern client, with a soft highlight roll-off; 0 = gamma
ColorSpace=1

; In-scattered sun or moon light (the halo around it) and ambient fog brightness
SunScatter=1.0
Ambient=1.0
Exposure=1.0
; Brightness of the Classic layers (1 = as authored; the modern client applies no exposure to its fog)
ClassicExposure=1.0
; How the Classic layers scatter the sun and moon: 0 = the phase peaks at 1 toward the light;
; 1 = energy-normalised, as the authored intensities suggest the modern client does: the horizon band of the far,
; evenly scattering layers about 12 times dimmer, the halo of strongly forward layers larger and much brighter
ClassicPhase=0

; Scatter up to eight nearby world point lights into the fog; intensity range 0..8
LocalLights=1
LocalLightIntensity=1.0
; Fade outdoor layers and sunlight using the camera's building/cave transition.
; InteriorDensity is the fraction of outdoor layer density retained indoors (0..1).
; Native interior distance fog is preserved. This follows the camera, not individual rooms along each ray.
InteriorAware=1
InteriorDensity=0.15
; Radial god rays from the bright sky around the sun, 0 = off (the client's glow already brightens the sun)
GodRays=0
; 1 = pre-compensate the fog for the client's full-screen glow (ffxGlow), which otherwise bleaches bright
; fog around the sun to white; 0 = off
GlowCompensation=1

; View distance in yards on the continents (Eastern Kingdoms, Kalimdor, Outland, Northrend), which Ascension
; caps at 791. Up to 1583 (the engine's limit, used in instances), within the client's own farclip setting.
; 0 = leave the client's cap. Turning it on when it was 0 at start-up needs a client restart; other changes,
; including 0, apply at the next farclip change, map load or zone change (e.g. "/console farclip 1583"), and
; raising it shows a loading screen at that moment. Costs about four times the loaded terrain.
FarClipMax=1583

; Fog range in yards: how far sky rays are integrated and the scale of the Classic distance curves
MaxDistance=5000
; History weight of the temporal filter, 0 = off
Temporal=0.85
; Keep the effect while the camera is under water
Underwater=0
; Let water surfaces write depth so water is fogged by its own distance (always on while modern water is drawn)
LiquidDepth=1

; Modern water: lakes, rivers, the sea and indoor pools are shaded like the modern client, with moving waves,
; refraction, foam, sun highlights and reflections. Magma and slime keep the client's look. While modern water is
; drawn (Water=1, waterdata.bin installed, camera above water), water surfaces write depth whatever LiquidDepth says.
; 1 = on, 0 = the client's own water
Water=1
; 1 = low: 128 waves, sky reflections only; 2 = medium: 256 waves, scene reflections;
; 3 = high: 256 waves, finer scene reflections
WaterQuality=2
; Wave height, 0..2; 0 = flat water
WaterWaves=1.0
; Wind that drives the waves, 0.5..10; stronger wind makes longer, rougher waves
WaterWind=2.0
; Foam on wave crests and along shores, 0..2; 0 = no foam
WaterFoam=1.0
; Reflections of the sky and the scene, 0..2; 0 = none
WaterReflections=1.0
; Highlight of the sun or moon on the water, 0..4; 0 = none
WaterSpecular=1.0
; How far you see into the water, 0.25..4; larger is clearer
WaterClarity=1.0
; How much the zone's own water colours (from the client's day and night lights) tint the water, 0..1;
; 0 = the modern colours only
WaterZoneColors=0.5
; 0 = off, 1 = wave normals, 2 = foam, 3 = transmittance, 4 = reflection, 5 = liquid class
WaterDebugView=0

; 0 = off, 1 = fog radiance only, 2 = transmittance, 3 = linear depth
DebugView=0
; Red marker where the sun direction projects on screen
SunMarker=0
; 0 = errors, 1 = info, 2 = debug
LogLevel=1
