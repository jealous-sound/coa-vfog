name: Windows release build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: windows-release-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: Build and check Win32 Release
        runs-on: windows-2022
        timeout-minutes: 30
        defaults:
            run:
                shell: pwsh
        steps:
            -   name: Check out source
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    persist-credentials: false

            -   name: Check source comments
                run: python tools/check_comments.py

            -   name: Configure Win32
                run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

            -   name: Build DLLs, shaders and harness
                run: cmake --build build --config Release --parallel

            -   name: Run checks that do not require a graphics device
                run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -LE gpu

            -   name: Assemble install files
                run: |
                    $package = 'build/package'
                    New-Item -ItemType Directory -Path $package | Out-Null
                    $files = 'version.dll', 'CoAVolFog.dll', 'CoAVolFog.ini', 'fogdata.bin', 'waterdata.bin'
                    foreach ($file in $files) {
                        Copy-Item -LiteralPath "build/Release/$file" -Destination $package -ErrorAction Stop
                    }
                    Copy-Item -LiteralPath README.md, LICENSE -Destination $package -ErrorAction Stop
                    Copy-Item -LiteralPath build/_deps/imgui-src/LICENSE.txt `
                        -Destination "$package/Dear-ImGui-LICENSE.txt"
                    @(
                        "Commit: $env:GITHUB_SHA"
                        "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                        'Configuration: Win32 Release'
                        'Validation: build, source comments and CPU harness passed.'
                        'D3D9 graphics checks and in-game validation were not run.'
                    ) | Set-Content -Path "$package/BUILD.txt" -Encoding utf8

            -   name: Upload install archive
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
                with:
                    name: CoAVolFog-Win32-${{ github.sha }}
                    path: build/package/
                    if-no-files-found: error
                    retention-days: 30

            -   name: Upload test diagnostics
                if: ${{ failure() }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
                with:
                    name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                        build/Testing/Temporary/
                        build/cpu-harness-out/harness.log
                        build/Release/CoAVolFog.log
                    if-no-files-found: ignore
                    retention-days: 7

    release:
        name: Publish latest build
        needs: build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            -   name: Download checked install files
                run: >-
                    gh run download "$GITHUB_RUN_ID"
                    --name "CoAVolFog-Win32-$GITHUB_SHA" --dir package

            -   name: Publish install ZIP
                shell: bash
                run: |
                    set -euo pipefail
                    current_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
                    if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
                        echo "Main has advanced; keeping the existing latest release."
                        exit 0
                    fi
                    version="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
                    archive="CoAVolFog-Win32.zip"
                    (cd package && zip -r "../$archive" .)
                    sha256sum "$archive" > "$archive.sha256"
                    {
                        echo "Automated Win32 Release build from commit $GITHUB_SHA."
                        echo
                        echo "Download CoAVolFog-Win32.zip below for the install files."
                        echo
                        echo "Build, source comments and CPU harness passed."
                        echo "D3D9 graphics checks and in-game validation were not run."
                        echo
                        echo "Build log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                    } > release-notes.md
                    gh release create "$version" "$archive" "$archive.sha256" \
                        --target "$GITHUB_SHA" --title "CoAVolFog $version" \
                        --notes-file release-notes.md --latest
